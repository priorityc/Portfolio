---
layout: default
---

<!-- C:\Portfolio\Portfolio\blog  bundle exec jekyll serve-->

{% seo %}
<div class="post-banner">
  <div class="post-banner-overlay">
    <h1>{{ page.title }}</h1>

    <p class="post-categories">
      {% for category in page.categories %}
      <span class="badge">{{ category }}</span>
      {% endfor %}
    </p>
  </div>
</div>

<div id="progress-bar"></div>

<div class="post-content">
  <img
    src="/blog/assets/newcosmiclook.png"
    alt="CosmicCare UI"
    class="post-image"
  />
  {{ content }}
</div>

<div class="share-section">
  <p>Share this post:</p>

  <a
    class="share-btn"
    href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ page.url | absolute_url }}"
    target="_blank"
  >
    Twitter
  </a>

  <a
    class="share-btn"
    href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}"
    target="_blank"
  >
    Facebook
  </a>

  <a
    class="share-btn"
    href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}"
    target="_blank"
  >
    LinkedIn
  </a>
</div>

<style>
  :root {
    --purple: #a855f7;
    --blue: #38bdf8;
    --indigo: #0f172a;
    --pink: #ec4899;
    --light: #f8fafc;
    --grey: #cbd5e1;
  }

  /* Banner */
  .post-banner {
    background:
      linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(56, 189, 248, 0.6)),
      url("{{ page.banner }}") center/cover no-repeat;
    height: 260px;
    border-radius: 14px;
    margin-bottom: 30px;
    position: relative;
  }

  .post-banner-overlay {
    position: absolute;
    bottom: 20px;
    left: 30px;
    color: var(--light);
  }

  .post-banner-overlay h1 {
    font-size: 2.6rem;
    margin: 0;
  }

  /* Category Badges */
  .badge {
    background: var(--pink);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    margin-right: 8px;
    font-size: 0.85rem;
  }

  .post-image {
    width: 100%;
    border-radius: 14px;
    margin: 30px 0;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  /* Reading Progress Bar */
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 5px;
    background: var(--blue);
    width: 0%;
    z-index: 9999;
  }

  .category-links a {
    color: var(--blue);
  }

  /* Typography */
  .post-content {
    font-size: 1.1rem;
    line-height: 1.7;
  }

  .post-content h2 {
    color: var(--purple);
    margin-top: 30px;
  }

  /* Share Buttons */
  .share-section {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--grey);
  }

  .share-btn {
    background: var(--purple);
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    margin-right: 10px;
    list-style-type: none;

    transition: background 0.2s ease;
  }

  .share-btn:hover {
    background: var(--pink);
  }
</style>

<script>
  window.addEventListener("scroll", () => {
    const scrollTop = document.documentElement.scrollTop;
    const height =
      document.documentElement.scrollHeight -
      document.documentElement.clientHeight;
    const progress = (scrollTop / height) * 100;
    document.getElementById("progress-bar").style.width = progress + "%";
  });
</script>
