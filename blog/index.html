---
layout: default
title: "Blog"
---

<div class="blog-header">
  <h1>Blog</h1>
  <p>Insights, tutorials, and updates from my creative journey.</p>
</div>

<div class="category-links">
  <a href="/blog/category/design">Design</a>
  <a href="/blog/category/tutorials">Tutorials</a>
  <a href="/blog/category/life">Life</a>
</div>

<div class="posts-grid">
  {% for post in site.posts %}
  <article class="post-card">
    <a href="{{ post.url | relative_url }}">
      <div class="post-card-content">
        <h2>{{ post.title }}</h2>
        <p class="post-date">{{ post.date | date: "%B %d, %Y" }}</p>
        <p class="excerpt">{{ post.excerpt | strip_html | truncate: 150 }}</p>
      </div>
    </a>
  </article>
  {% endfor %}
</div>

<style>
  /* --- Cosmic Portfolio Colors --- */
  :root {
    --purple: #a855f7;
    --purple-light: #c084fc;
    --blue: #38bdf8;
    --blue-light: #7dd3fc;
    --indigo: #222238ff;
    --grey-light: #f8fafc;
    --grey-medium: #cbd5e1;
    --grey-dark: #64748b;
    --pink: #ec4899;
  }

  /* --- Blog Header --- */
  .blog-header {
    text-align: center;
    margin: 60px auto 40px;
    max-width: 700px;
  }

  .blog-header h1 {
    font-size: 3rem;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 10px;
  }

  .blog-header p {
    font-size: 1.2rem;
    color: var(--grey-medium);
  }

  /* --- Grid Layout --- */
  .posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto 80px;
    padding: 0 20px;
  }

  /* --- Post Card --- */
  .post-card {
    border-radius: 14px;
    border: 1px solid var(--grey-dark);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    transition: all 0.25s ease;
    overflow: hidden;
  }

  .post-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    border-color: var(--purple);
  }

  .post-card a {
    text-decoration: none;
    /* color: inherit; */
    background-color: var(--grey-light);
    color: var(--grey-dark);
    display: block;
    padding: 25px;
  }

  .post-card-content h2 {
    font-size: 1.5rem;
    margin: 0 0 10px;
    font-weight: 600;
    color: var(--blue-light);
  }

  .post-date {
    font-size: 0.9rem;
    color: var(--grey-medium);
    margin-bottom: 12px;
  }

  .excerpt {
    color: var(--grey-light);
    line-height: 1.5;
  }

  /* --- Responsive Tweaks --- */
  @media (max-width: 600px) {
    .blog-header h1 {
      font-size: 2.4rem;
    }
    .posts-grid {
      gap: 20px;
    }
  }
</style>
